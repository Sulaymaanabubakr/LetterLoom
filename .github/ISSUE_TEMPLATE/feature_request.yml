name: Feature request
description: Suggest an improvement to LetterLoom
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user need or limitation, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Explain how the feature should work and where it fits in the current app.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe other approaches or workarounds you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, or other relevant context. Do not include private information.
